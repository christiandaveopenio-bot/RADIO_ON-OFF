<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio</title>
  <link rel="stylesheet" href="rad.css">
</head>
<body>

 <div class="bg-radio">
    <img id="radio_img" src="img_on_off/radoff.png" class="radio_off" alt="A vintage radio">
    <button class="btn" type="button" aria-label="Radio power" aria-pressed="false"></button>
    <button class="tune tune-left" type="button" aria-label="Random sound">▶</button>
    <button class="tune tune-right" type="button" aria-label="Volume">75%</button>
  </div>

  <script src="button.js"></script>
</body>
</html>
